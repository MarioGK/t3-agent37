[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "t3-agent37"
version = "0.1.6"
description = "Provision Agent37 cloud environments for T3 Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4"]

[project.scripts]
t3-agent37 = "t3_agent37.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
