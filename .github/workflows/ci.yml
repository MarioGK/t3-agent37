name: CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sh -n install.sh
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - if: matrix.python == '3.14'
        run: python tests/native_smoke.py
      - run: t3-agent37 create ci-pilot --dry-run

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and validate packages
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/pip install dist/*.whl
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$(/tmp/release-smoke/bin/t3-agent37 --version)" = "$version"
          /tmp/release-smoke/bin/t3-agent37 create release-smoke --dry-run
      - name: Publish new version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if gh release view "v$version" >/dev/null 2>&1; then
            exit 0
          fi
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "v$version" --generate-notes
