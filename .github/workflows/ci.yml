name: CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      ASSET: t3-agent37-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: matrix.os != 'windows'
        run: sh -n install.sh
      - if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $tokens = $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors) { throw ($parseErrors -join "`n") }
      - run: go test ./...
      - name: Smoke test the pinned T3 relay
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        env:
          T3_AGENT37_NATIVE_SMOKE: '1'
        run: go test ./internal/agent37 -run '^TestNativeT3RelaySmoke$' -v
      - name: Build and smoke test the executable
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$ASSET" ./cmd/t3-agent37
          test "$(./dist/"$ASSET" --version)" = "$version"
          ./dist/"$ASSET" create --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: t3-agent37-*
          merge-multiple: true
          path: dist
      - name: Publish versioned executables
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          (
            cd dist
            sha256sum t3-agent37-{linux,darwin}-{amd64,arm64} t3-agent37-windows-{amd64,arm64}.exe > SHA256SUMS
          )
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = true ]; then
              test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
              gh release upload "$tag" dist/t3-agent37-* dist/SHA256SUMS --clobber
              gh release edit "$tag" --draft=false --latest
            fi
          else
            gh release create "$tag" dist/t3-agent37-* dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes --latest
          fi
          expected=$(cd dist && printf '%s\n' SHA256SUMS t3-agent37-* | sort)
          actual=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$actual" = "$expected"
